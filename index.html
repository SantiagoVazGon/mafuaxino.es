<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>León Uniformes - Elegancia y Seguridad</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #fcfbf9; /* Cream/Off-white */
            color: #0f172a; /* Navy/Slate */
        }
        h1, h2, h3, h4, .serif { 
            font-family: 'Playfair Display', serif; 
        }
        .fade-in { 
            animation: fadeIn 0.6s ease-out forwards; 
        }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .nav-link {
            position: relative;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.875rem;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: currentColor;
            transition: width 0.3s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const products = [
            { id: 1, name: "Línea Corporativa Ejecutiva", category: "Oficina", img: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=800" },
            { id: 2, name: "Filipinas Médicas Premium", category: "Salud", img: "https://images.unsplash.com/photo-1584515933487-779824d29309?auto=format&fit=crop&q=80&w=800" },
            { id: 3, name: "Mezclilla Industrial de Alta Resistencia", category: "Industria", img: "https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?auto=format&fit=crop&q=80&w=800" },
            { id: 4, name: "Uniformes Gastronómicos", category: "Hostelería", img: "https://images.unsplash.com/photo-1577219491135-ce391730fb2c?auto=format&fit=crop&q=80&w=800" }
        ];

        const Navbar = ({ setPage }) => (
            <nav className="flex items-center justify-between px-8 py-6 bg-[#fcfbf9] border-b border-gray-200 sticky top-0 z-50">
                <div className="flex space-x-8">
                    <button onClick={() => setPage('home')} className="nav-link text-slate-800">Inicio</button>
                    <button onClick={() => setPage('shop')} className="nav-link text-slate-800">Colecciones</button>
                </div>
                <div className="text-center cursor-pointer" onClick={() => setPage('home')}>
                    <h1 className="text-3xl serif tracking-widest text-slate-900 uppercase">León</h1>
                    <p className="text-[0.6rem] tracking-[0.3em] text-slate-500 uppercase mt-1">Uniformes & Equipamiento</p>
                </div>
                <div className="flex space-x-8">
                    <button onClick={() => setPage('about')} className="nav-link text-slate-800">Nosotros</button>
                    <button onClick={() => setPage('contact')} className="nav-link text-slate-800">Contacto</button>
                </div>
            </nav>
        );

        const Footer = () => (
            <footer className="bg-slate-900 text-stone-300 py-16 px-8 mt-20">
                <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-12 text-center md:text-left">
                    <div>
                        <h2 className="text-2xl serif text-white tracking-widest uppercase mb-4">León</h2>
                        <p className="text-sm font-light leading-relaxed">Fabricantes directos de ropa de trabajo, calzado industrial y equipo de seguridad con la más alta calidad.</p>
                    </div>
                    <div className="flex flex-col space-y-3 text-sm font-light">
                        <span className="uppercase tracking-widest text-white mb-2 text-xs">Atención al Cliente</span>
                        <a href="#" className="hover:text-white transition-colors">Guía de Tallas</a>
                        <a href="#" className="hover:text-white transition-colors">Envíos y Devoluciones</a>
                        <a href="#" className="hover:text-white transition-colors">Pedidos Mayoristas</a>
                    </div>
                    <div className="flex flex-col space-y-3 text-sm font-light">
                        <span className="uppercase tracking-widest text-white mb-2 text-xs">Contacto</span>
                        <p>ventas@leonuniformes.com</p>
                        <p>Lun - Vie, 9:00 - 18:00</p>
                    </div>
                </div>
                <div className="max-w-6xl mx-auto mt-16 pt-8 border-t border-slate-700 text-center text-xs font-light tracking-wide">
                    &copy; 2026 León Uniformes. Todos los derechos reservados.
                </div>
            </footer>
        );

        const Home = ({ setPage }) => (
            <div className="fade-in">
                {/* Hero Section */}
                <div className="relative h-[80vh] w-full overflow-hidden bg-slate-900 flex items-center justify-center">
                    <div className="absolute inset-0 z-0">
                        <img 
                            src="https://images.unsplash.com/photo-1584515933487-779824d29309?auto=format&fit=crop&q=80&w=2000" 
                            className="w-full h-full object-cover opacity-60"
                            alt="Profesionales médicos"
                        />
                    </div>
                    <div className="relative z-10 text-center text-white px-4">
                        <h2 className="serif text-5xl md:text-7xl font-light mb-6 tracking-wide drop-shadow-lg">El Estándar de la Excelencia</h2>
                        <p className="text-lg md:text-xl font-light mb-10 tracking-widest uppercase drop-shadow-md">Tradición, Resistencia y Diseño</p>
                        <button onClick={() => setPage('shop')} className="bg-white text-slate-900 px-10 py-4 uppercase tracking-widest text-sm hover:bg-slate-200 transition-colors duration-300">
                            Explorar Colección
                        </button>
                    </div>
                </div>

                {/* Categories */}
                <div className="max-w-7xl mx-auto py-24 px-8">
                    <div className="text-center mb-16">
                        <h3 className="serif text-3xl text-slate-900 mb-3">Nuestras Líneas</h3>
                        <div className="w-16 h-px bg-slate-900 mx-auto"></div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {products.slice(0, 2).map((prod) => (
                            <div key={prod.id} className="group relative h-96 overflow-hidden cursor-pointer" onClick={() => setPage('shop')}>
                                <img src={prod.img} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" alt={prod.name} />
                                <div className="absolute inset-0 bg-black/20 group-hover:bg-black/10 transition-colors duration-500"></div>
                                <div className="absolute bottom-8 left-8 text-white">
                                    <p className="text-xs uppercase tracking-widest mb-1">{prod.category}</p>
                                    <h4 className="serif text-2xl">{prod.name}</h4>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        const Shop = () => (
            <div className="fade-in max-w-7xl mx-auto py-16 px-8">
                <h2 className="serif text-4xl text-center mb-4">Colección Completa</h2>
                <p className="text-center text-slate-500 mb-12 font-light">Equipamiento diseñado para el rendimiento diario.</p>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                    {products.map((prod) => (
                        <div key={prod.id} className="group cursor-pointer">
                            <div className="overflow-hidden mb-4 h-80 bg-gray-100">
                                <img src={prod.img} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" alt={prod.name} />
                            </div>
                            <div className="text-center">
                                <h4 className="serif text-lg text-slate-900">{prod.name}</h4>
                                <p className="text-xs uppercase tracking-widest text-slate-500 mt-2">{prod.category}</p>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const About = () => (
            <div className="fade-in max-w-4xl mx-auto py-24 px-8 text-center">
                <h2 className="serif text-4xl mb-8">Nuestra Historia</h2>
                <div className="w-16 h-px bg-slate-900 mx-auto mb-10"></div>
                <p className="text-lg leading-relaxed font-light text-slate-700 mb-6">
                    Con más de dos décadas de experiencia ininterrumpida en la industria, León Uniformes nació de la dedicación al trabajo bien hecho. Entendemos que un uniforme no es solo una prenda, sino la identidad y la armadura diaria de los profesionales.
                </p>
                <p className="text-lg leading-relaxed font-light text-slate-700">
                    Nuestra trayectoria fabricando ropa de trabajo, zapatos de seguridad y líneas ejecutivas nos ha permitido perfeccionar cada costura, asegurando que cada prenda ofrezca la resistencia que exige el trabajo pesado y la elegancia que requiere la atención corporativa.
                </p>
            </div>
        );

        const Contact = () => (
            <div className="fade-in max-w-3xl mx-auto py-24 px-8">
                <h2 className="serif text-4xl text-center mb-12">Póngase en Contacto</h2>
                <form className="space-y-8">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <label className="block text-xs uppercase tracking-widest text-slate-500 mb-2">Nombre Completo</label>
                            <input type="text" className="w-full bg-transparent border-b border-slate-300 py-2 focus:outline-none focus:border-slate-900 transition-colors" />
                        </div>
                        <div>
                            <label className="block text-xs uppercase tracking-widest text-slate-500 mb-2">Empresa</label>
                            <input type="text" className="w-full bg-transparent border-b border-slate-300 py-2 focus:outline-none focus:border-slate-900 transition-colors" />
                        </div>
                    </div>
                    <div>
                        <label className="block text-xs uppercase tracking-widest text-slate-500 mb-2">Correo Electrónico</label>
                        <input type="email" className="w-full bg-transparent border-b border-slate-300 py-2 focus:outline-none focus:border-slate-900 transition-colors" />
                    </div>
                    <div>
                        <label className="block text-xs uppercase tracking-widest text-slate-500 mb-2">Mensaje / Requerimientos</label>
                        <textarea rows="4" className="w-full bg-transparent border-b border-slate-300 py-2 focus:outline-none focus:border-slate-900 transition-colors"></textarea>
                    </div>
                    <button type="button" className="w-full bg-slate-900 text-white py-4 uppercase tracking-widest text-sm hover:bg-slate-800 transition-colors">
                        Enviar Solicitud
                    </button>
                </form>
            </div>
        );

        const App = () => {
            const [page, setPage] = useState('home');

            return (
                <div className="min-h-screen flex flex-col">
                    <Navbar setPage={setPage} />
                    <main className="flex-grow">
                        {page === 'home' && <Home setPage={setPage} />}
                        {page === 'shop' && <Shop />}
                        {page === 'about' && <About />}
                        {page === 'contact' && <Contact />}
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
